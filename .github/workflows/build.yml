name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    name: Linux (AppImage / .deb / tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils patchelf squashfs-tools fakeroot
      - name: Build packages
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bluemail-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  windows:
    name: Windows (setup wizard .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build BlueMail.exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt5 pyinstaller
          python -m PyInstaller --noconfirm --windowed --name BlueMail --paths . main.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installation wizard
        run: ISCC.exe packaging/windows/BlueMail.iss
      - uses: actions/upload-artifact@v4
        with:
          name: bluemail-windows
          path: dist/BlueMail-Setup-*.exe

  macos:
    name: macOS (installer .pkg / .dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build installer package
        run: bash packaging/macos/build_pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bluemail-macos
          path: |
            dist/BlueMail*.pkg
            dist/BlueMail.dmg